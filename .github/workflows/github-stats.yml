
name: Update GitHub Profile Statistics

on:
  schedule:
    # Daily at 8:30 AM IST
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Profile Statistics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Generate GitHub Statistics
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=abinash021&show_icons=true&hide_border=true&rank_icon=github&theme=github_dark
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Generate Top Languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=abinash021&layout=compact&hide_border=true&langs_count=6&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate Contribution Streak
      - name: Generate Contribution Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=abinash021&theme=dark&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Commit generated SVG files
      - name: Commit Statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile statistics"
          git push
